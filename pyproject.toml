[project]
name = "football-vnext"
version = "0.1.0"
description = "Data-driven football prediction and value-betting system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.4",
    "pandas>=2.1",
    "streamlit>=1.35",
    "requests>=2.31",
    "anthropic>=0.40",
      "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

